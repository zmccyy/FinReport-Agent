# M6.05 Prometheus 抓取配置 — deploy 栈内网直连容器名。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # L2 backend：micrometer-registry-prometheus（/actuator/prometheus）
  - job_name: finreport-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  # L3 ai-service：prometheus_client（/metrics）
  - job_name: finreport-ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]
