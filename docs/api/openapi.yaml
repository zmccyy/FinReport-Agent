openapi: 3.0.3
info:
  title: FinReport Agent API
  version: 0.2.0
  description: |
    M1.01–M1.12 认证/上传/任务/SSE 接口 + M2.11 三表查询 + M3.09 勾稽/异常/产物查询接口。
    错误响应遵循 RFC 9457。所有非 /internal/* 端点需 Bearer JWT，由 JwtFilter 注入 X-User-Id 头。
servers:
  - url: http://localhost:8080
paths:
  /api/v1/reports/upload:
    post:
      summary: 上传 PDF 财报并创建或复用处理任务
      description: |
        成功始终保持 HTTP 201。相同用户与同一 PDF MD5 在任务为排队、运行或成功时会返回已有 task/report；
        FAILED 或 CANCELLED 的历史任务仅可用新的 Idempotency-Key 创建重试任务。Idempotency-Key 按用户隔离。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, companyCode, companyName, reportType, reportPeriod]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF，最大 50 MB。
                companyCode:
                  type: string
                  example: '600519'
                companyName:
                  type: string
                  example: 贵州茅台
                reportType:
                  type: string
                  example: ANNUAL
                reportPeriod:
                  type: string
                  example: '2024-12-31'
      responses:
        '201':
          description: 新建任务或符合去重规则的既有任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '409':
          description: Idempotency-Key 冲突。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                keyReused:
                  value:
                    type: https://finreport.example/errors/IDEMPOTENCY_KEY_REUSED
                    title: Conflict
                    status: 409
                    detail: 同一个 Idempotency-Key 不能用于不同的文件
                inProgress:
                  value:
                    type: https://finreport.example/errors/IDEMPOTENCY_REQUEST_IN_PROGRESS
                    title: Conflict
                    status: 409
                    detail: 同一 Idempotency-Key 的上传请求仍在处理中
  /api/v1/tasks/{id}:
    get:
      summary: 查询当前用户的任务
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/TaskNotFound'
  /api/v1/tasks/{id}/cancel:
    post:
      summary: 取消当前用户的任务
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 取消后的任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/TaskNotFound'
  /api/v1/tasks/{id}/stream:
    get:
      summary: 订阅当前用户的任务进度
      description: |
        事件 ID 统一为 `{taskId}:{sequence}`。带 Last-Event-ID 时从 Redis 持久化历史补发；
        游标无效、事件过期或无历史时至少返回最新快照，再接入实时 fan-out。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          example: task-abc:42
      responses:
        '200':
          description: text/event-stream，事件类型为 progress、done、error，另有 heartbeat comment。
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/TaskNotFound'
  /api/v1/reports/{reportId}:
    get:
      summary: 查询财报详情（M2.11）
      description: |
        返回报告头部信息：公司、报告期间、PDF 元数据、解析状态。
        不存在或不属于当前用户的 report 统一返回 404，避免泄露资源存在性。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: 报告详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetailResponse'
        '404':
          $ref: '#/components/responses/ReportNotFound'
  /api/v1/reports/{reportId}/statements:
    get:
      summary: 查询三表数据（M2.11）
      description: |
        一次性返回资产负债表 / 利润表 / 现金流量表的科目条目，前端按 Tab 切换渲染。
        三张表 key 固定：balanceSheet / incomeStatement / cashFlow；空表返回空数组。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: 三表分组数据。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementsResponse'
        '404':
          $ref: '#/components/responses/ReportNotFound'
  /api/v1/reports/{reportId}/checks:
    get:
      summary: 查询勾稽核对结果（M3.09）
      description: |
        返回 accounting_check 表的规则列表，按 ruleType 升序。
        每条含预期/实际/差额/通过标识/严重度/说明；note 字段可能含「[LLM 复核] ...」前缀。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: 勾稽结果列表（可能为空数组，表示 REPORT 阶段尚未完成）。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingCheckResponse'
        '404':
          $ref: '#/components/responses/ReportNotFound'
  /api/v1/reports/{reportId}/anomalies:
    get:
      summary: 查询异常检测结果（M3.09）
      description: |
        返回 anomaly 表的异常列表，按 anomalyType + itemName 升序。
        anomalyType ∈ {yoy_change, qoq_change, logic_conflict}；severity ∈ {INFO, WARN, ERROR, CRITICAL}。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: 异常列表（可能为空数组）。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnomalyResponse'
        '404':
          $ref: '#/components/responses/ReportNotFound'
  /api/v1/reports/{reportId}/artifacts:
    get:
      summary: 查询报告产物（M3.09）
      description: |
        返回 report_artifact 表的产物列表，按 artifactType 升序。
        artifactType ∈ {PDF, MARKDOWN, CHART_PIE, CHART_LINE, CHART_BAR}；
        status=GENERATED 附带 MinIO 预签名下载 URL（默认 7 天有效），status=FAILED 返回空 URL。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: 产物列表（可能为空数组，表示 REPORT 阶段尚未完成）。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportArtifactResponse'
        '404':
          $ref: '#/components/responses/ReportNotFound'
  /internal/live:
    get:
      summary: 后端 liveness
      responses:
        '200':
          description: 后端进程可运行。
  /internal/health:
    get:
      summary: 后端 readiness
      responses:
        '200':
          description: MySQL、Redis、RabbitMQ、MinIO 和 AI 服务均就绪。
        '503':
          description: 至少一个依赖不可用。
  /internal/models/load:
    post:
      summary: 加载本地 LLM 到 ModelHub
      description: |
        M2.04：按逻辑名 + 量化标签加载本地 4-bit LLM（7B GPTQ-Int4 / 1.5B NF4）。
        单模型驻存：加载不同 key 会先 unload 当前模型释放显存。
        失败抛 AiException → 500 JSON envelope（ModelLoadException）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadModelRequest'
      responses:
        '200':
          description: 模型加载成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadModelResponse'
        '500':
          description: 加载失败（缺依赖 / OOM / 权重缺失）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/models/status:
    get:
      summary: 查询 ModelHub 当前状态
      responses:
        '200':
          description: 当前驻存 LLM + scene 路由表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelStatusResponse'
  /internal/models/generate:
    post:
      summary: 在驻存 LLM 上跑一次 generate
      description: |
        推理超时（默认 60s）抛 InferenceTimeoutException → 500；
        OOM 抛 ModelLoadException → 500（上层按 spec §10.3 切 API 72B）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: 推理完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '500':
          description: 推理失败或超时。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/models/unload:
    post:
      summary: 卸载当前驻存 LLM
      responses:
        '200':
          description: 卸载完成（无论之前是否加载）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnloadResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
  responses:
    TaskNotFound:
      description: 不存在或不属于当前用户；两种情况统一为 TASK_NOT_FOUND，避免泄露资源存在性。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://finreport.example/errors/TASK_NOT_FOUND
            title: Not Found
            status: 404
            detail: 任务不存在
    ReportNotFound:
      description: 不存在或不属于当前用户的 report；统一为 REPORT_NOT_FOUND，避免泄露资源存在性。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://finreport.example/errors/REPORT_NOT_FOUND
            title: Not Found
            status: 404
            detail: 报告不存在
  schemas:
    UploadResponse:
      type: object
      required: [taskId, reportId, status]
      properties:
        taskId:
          type: string
        reportId:
          type: integer
          format: int64
        status:
          type: string
          example: QUEUED
    Task:
      type: object
      properties:
        id:
          type: string
        taskType:
          type: string
        refReportId:
          type: integer
          format: int64
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCESS, FAILED, CANCELLED]
        currentStep:
          type: string
        progress:
          type: integer
        errorMsg:
          type: string
          nullable: true
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
    LoadModelRequest:
      type: object
      required: [model, quant]
      properties:
        model:
          type: string
          example: '7b'
          description: 逻辑模型名（`7b` / `1.5b`）。
        quant:
          type: string
          example: gptq-int4
          description: 量化标签（`gptq-int4` / `nf4`）。
    LoadModelResponse:
      type: object
      properties:
        model:
          type: string
        quant:
          type: string
        loaded:
          type: boolean
          example: true
    GenerateRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        max_new_tokens:
          type: integer
          minimum: 1
          maximum: 4096
          default: 512
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.0
        timeout_seconds:
          type: number
          nullable: true
          minimum: 1
          maximum: 600
    GenerateResponse:
      type: object
      properties:
        text:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        latency_ms:
          type: number
        first_token_ms:
          type: number
    ModelStatusResponse:
      type: object
      properties:
        loaded_llm:
          type: string
          nullable: true
        is_loaded:
          type: boolean
        scenes:
          type: object
          additionalProperties:
            type: object
            properties:
              model:
                type: string
              quant:
                type: string
    UnloadResponse:
      type: object
      properties:
        unloaded:
          type: boolean
        status:
          type: object
    ReportDetailResponse:
      type: object
      required: [id, taskId, companyCode, companyName, reportType, reportPeriod, parseStatus, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        taskId:
          type: string
          description: 关联任务 ID，用于前端跳转进度页。
        companyCode:
          type: string
          example: '600519'
        companyName:
          type: string
          example: 贵州茅台
        reportType:
          type: string
          enum: [ANNUAL, SEMI, Q1, Q3]
        reportPeriod:
          type: string
          example: '2024-12-31'
        pageCount:
          type: integer
          nullable: true
          description: PDF 页数；解析前可能为 null。
        parseStatus:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        pdfObjectKey:
          type: string
          nullable: true
          description: MinIO 对象 key，用于生成预签名下载 URL。
        createdAt:
          type: string
          format: date-time
    StatementsResponse:
      type: object
      required: [balanceSheet, incomeStatement, cashFlow]
      properties:
        balanceSheet:
          type: array
          items:
            $ref: '#/components/schemas/StatementItemResponse'
        incomeStatement:
          type: array
          items:
            $ref: '#/components/schemas/StatementItemResponse'
        cashFlow:
          type: array
          items:
            $ref: '#/components/schemas/StatementItemResponse'
    StatementItemResponse:
      type: object
      required: [id, statementType, itemName]
      properties:
        id:
          type: integer
          format: int64
        statementType:
          type: string
          enum: [balance_sheet, income_statement, cash_flow]
        itemName:
          type: string
          example: 货币资金
        itemValue:
          type: number
          nullable: true
          description: DECIMAL(20,4)，null 表示科目缺失。
        currency:
          type: string
          example: CNY
        unit:
          type: string
          example: 元
        scope:
          type: string
          example: 合并
        periodType:
          type: string
          description: 本期 / 上期 等。
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        sourcePage:
          type: integer
          nullable: true
          description: 源 PDF 页码，用于回溯定位。
    AccountingCheckResponse:
      type: object
      required: [id, ruleName, ruleType, isPass, severity, createdAt]
      properties:
        id:
          type: integer
          format: int64
        ruleName:
          type: string
          example: 资产负债表恒等式
        ruleType:
          type: string
          enum: [balance_sheet_identity, net_income_to_retained, cash_flow_vs_net_income]
        expected:
          type: number
          nullable: true
        actual:
          type: number
          nullable: true
        diff:
          type: number
          nullable: true
          description: actual - expected。
        isPass:
          type: boolean
        severity:
          type: string
          enum: [INFO, WARN, ERROR, CRITICAL]
        note:
          type: string
          nullable: true
          description: 可能含「[LLM 复核] ...」前缀的说明文本。
        createdAt:
          type: string
          format: date-time
    AnomalyResponse:
      type: object
      required: [id, itemName, anomalyType, severity, createdAt]
      properties:
        id:
          type: integer
          format: int64
        itemName:
          type: string
          example: 营业收入
        anomalyType:
          type: string
          enum: [yoy_change, qoq_change, logic_conflict]
        metricValue:
          type: number
          nullable: true
        threshold:
          type: number
          nullable: true
        description:
          type: string
          nullable: true
        severity:
          type: string
          enum: [INFO, WARN, ERROR, CRITICAL]
        createdAt:
          type: string
          format: date-time
    ReportArtifactResponse:
      type: object
      required: [id, artifactType, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        artifactType:
          type: string
          enum: [PDF, MARKDOWN, CHART_PIE, CHART_LINE, CHART_BAR]
        objectKey:
          type: string
          nullable: true
          description: MinIO 对象 key；status=FAILED 时可能为 null。
        status:
          type: string
          enum: [GENERATED, FAILED]
        downloadUrl:
          type: string
          description: MinIO 预签名下载 URL；status=FAILED 时返回空字符串。
          example: https://minio.example.com/finreport-reports/reports/1001/report.pdf?X-Amz-Signature=...
        createdAt:
          type: string
          format: date-time
